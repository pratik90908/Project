name: desktop-cygwin-path-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-cygwin-path-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproduce Desktop Cygwin shell construction safely
        id: reproduce
        continue-on-error: true
        shell: bash
        env:
          PAYLOAD: 'evil$(touch${IFS}marker)'
        run: |
          set -u
          root="${RUNNER_TEMP}/desktop-cygwin-probe"
          repo_path="${root}/Project-${PAYLOAD}"
          rm -rf "$root"
          mkdir -p "$repo_path"
          marker="$repo_path/marker"

          # Desktop's Cygwin launcher uses shell:true and cwd:path while embedding
          # the repository path in shell source:
          #   /bin/sh -lc 'cd "$(cygpath "<path>")"; exec bash'
          script=$(printf 'cd "$(cygpath "%s")"; true' "$repo_path")
          (cd "$repo_path" && bash -lc "$script") || true

          mkdir -p security-probe-results
          if [[ -e "$marker" ]]; then
            echo 'marker_created=true' > security-probe-results/desktop-cygwin-path.txt
          else
            echo 'marker_created=false' > security-probe-results/desktop-cygwin-path.txt
          fi
          printf 'payload_branch=%s\n' "$PAYLOAD" >> security-probe-results/desktop-cygwin-path.txt
          printf 'generated_script=%s\n' "$script" >> security-probe-results/desktop-cygwin-path.txt

      - name: Ensure verdict exists
        if: always()
        shell: bash
        run: |
          mkdir -p security-probe-results
          if [[ ! -f security-probe-results/desktop-cygwin-path.txt ]]; then
            echo 'marker_created=probe_step_failed' > security-probe-results/desktop-cygwin-path.txt
          fi

      - name: Commit verdict
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security-probe-results/desktop-cygwin-path.txt
          git commit -m 'Record Desktop Cygwin path injection probe' || exit 0
          git push
