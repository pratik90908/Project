name: cache-readonly-downgrade-probe

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verdict repository
        uses: actions/checkout@v7
        with:
          path: verdict-repo

      - name: Prepare harmless cache payload
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cache-downgrade-marker"
          printf 'CACHE_DOWNGRADE_MARKER\n' > "$RUNNER_TEMP/cache-downgrade-marker/marker.txt"

      - name: Normal read-only save control
        id: normal
        continue-on-error: true
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ${{ runner.temp }}/cache-downgrade-marker
          key: cache-ro-normal-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove client mode hint, keep v2
        id: forced_v2
        continue-on-error: true
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca
        env:
          ACTIONS_CACHE_MODE: ''
        with:
          path: ${{ runner.temp }}/cache-downgrade-marker
          key: cache-ro-forced-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove client mode and force legacy v1 selection
        id: forced_v1
        continue-on-error: true
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca
        env:
          ACTIONS_CACHE_MODE: ''
          ACTIONS_CACHE_SERVICE_V2: ''
        with:
          path: ${{ runner.temp }}/cache-downgrade-marker
          key: cache-ro-forced-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record authoritative cache API verdict
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESULT="$GITHUB_WORKSPACE/verdict-repo/security-probe-results/cache-readonly-downgrade.txt"
          mkdir -p "$(dirname "$RESULT")"
          : > "$RESULT"
          echo "event=$GITHUB_EVENT_NAME" >> "$RESULT"
          echo "github_ref=$GITHUB_REF" >> "$RESULT"
          echo "normal.step_outcome=${{ steps.normal.outcome }}" >> "$RESULT"
          echo "forced_v2.step_outcome=${{ steps.forced_v2.outcome }}" >> "$RESULT"
          echo "forced_v1.step_outcome=${{ steps.forced_v1.outcome }}" >> "$RESULT"

          inspect_key() {
            label="$1"
            key="$2"
            out="$RUNNER_TEMP/${label}.json"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/caches?key=${key}" > "$out" 2>/dev/null || printf '{"total_count":0,"actions_caches":[]}' > "$out"
            count=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("total_count",0))' "$out")
            ref=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); a=d.get("actions_caches",[]); print(a[0].get("ref","") if a else "")' "$out")
            echo "${label}.cache_count=$count" >> "$RESULT"
            echo "${label}.cache_ref=$ref" >> "$RESULT"
          }

          inspect_key normal "cache-ro-normal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          inspect_key forced_v2 "cache-ro-forced-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          inspect_key forced_v1 "cache-ro-forced-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Commit verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd verdict-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security-probe-results/cache-readonly-downgrade.txt
          git commit -m 'Record cache read-only downgrade probe' || exit 0
          git push
