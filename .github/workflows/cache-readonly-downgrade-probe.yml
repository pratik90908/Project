name: cache-readonly-downgrade-probe

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verdict repository
        uses: actions/checkout@v7
        with:
          path: verdict-repo

      - name: Fetch current actions/cache source
        uses: actions/checkout@v7
        with:
          repository: actions/cache
          ref: 3edfce9056124e459a23f683a21433670d47daca
          path: cache-action-src
          persist-credentials: false

      - name: Probe server-side cache write enforcement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          RESULT="$GITHUB_WORKSPACE/verdict-repo/security-probe-results/cache-readonly-downgrade.txt"
          mkdir -p "$(dirname "$RESULT")" "$RUNNER_TEMP/cache-downgrade-marker"
          printf 'CACHE_DOWNGRADE_MARKER\n' > "$RUNNER_TEMP/cache-downgrade-marker/marker.txt"
          : > "$RESULT"

          boolenv() {
            if [[ -n "${!1:-}" ]]; then echo true; else echo false; fi
          }

          echo "event=$GITHUB_EVENT_NAME" >> "$RESULT"
          echo "github_ref=$GITHUB_REF" >> "$RESULT"
          echo "cache_mode=${ACTIONS_CACHE_MODE:-<unset>}" >> "$RESULT"
          echo "cache_service_v2_present=$(boolenv ACTIONS_CACHE_SERVICE_V2)" >> "$RESULT"
          echo "cache_url_present=$(boolenv ACTIONS_CACHE_URL)" >> "$RESULT"
          echo "results_url_present=$(boolenv ACTIONS_RESULTS_URL)" >> "$RESULT"

          run_case() {
            label="$1"
            service="$2"
            key="cache-downgrade-${label}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            log="$RUNNER_TEMP/${label}.log"

            if [[ "$service" == "v2" ]]; then
              set +e
              env \
                ACTIONS_CACHE_MODE= \
                INPUT_PATH="$RUNNER_TEMP/cache-downgrade-marker" \
                INPUT_KEY="$key" \
                node "$GITHUB_WORKSPACE/cache-action-src/dist/save-only/index.js" > "$log" 2>&1
              ec=$?
              set -e
            else
              set +e
              env \
                ACTIONS_CACHE_MODE= \
                ACTIONS_CACHE_SERVICE_V2= \
                INPUT_PATH="$RUNNER_TEMP/cache-downgrade-marker" \
                INPUT_KEY="$key" \
                node "$GITHUB_WORKSPACE/cache-action-src/dist/save-only/index.js" > "$log" 2>&1
              ec=$?
              set -e
            fi

            echo "${label}.exit=$ec" >> "$RESULT"
            if grep -qi 'cache write denied' "$log"; then
              echo "${label}.write_denied=true" >> "$RESULT"
            else
              echo "${label}.write_denied=false" >> "$RESULT"
            fi
            if grep -qi 'Cache saved with key\|Cache saved successfully' "$log"; then
              echo "${label}.client_reported_saved=true" >> "$RESULT"
            else
              echo "${label}.client_reported_saved=false" >> "$RESULT"
            fi

            api_json="$RUNNER_TEMP/${label}-api.json"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/caches?key=${key}" > "$api_json" 2>/dev/null || printf '{"total_count":0,"actions_caches":[]}' > "$api_json"
            count=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("total_count",0))' "$api_json")
            ref=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); a=d.get("actions_caches",[]); print(a[0].get("ref","") if a else "")' "$api_json")
            echo "${label}.cache_count=$count" >> "$RESULT"
            echo "${label}.cache_ref=$ref" >> "$RESULT"
          }

          run_case forced_v2 v2
          run_case forced_v1 v1

      - name: Commit verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd verdict-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security-probe-results/cache-readonly-downgrade.txt
          git commit -m 'Record cache read-only downgrade probe' || exit 0
          git push
