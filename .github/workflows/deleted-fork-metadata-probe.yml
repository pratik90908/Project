name: deleted-fork-metadata-probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public deleted-fork PR metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          curl -sS -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/mvt-project/mvt/pulls/812 > "$RUNNER_TEMP/pr.json"
          jq '{state,head:{label:.head.label,ref:.head.ref,sha:.head.sha,repo:.head.repo},base:{repo_id:.base.repo.id,full_name:.base.repo.full_name}}' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/evidence/result.json"
          cat "$RUNNER_TEMP/evidence/result.json"

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: deleted-fork-metadata-evidence
          path: ${{ runner.temp }}/evidence/result.json
